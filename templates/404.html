 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Lost Page</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: #fafafa;
    color: #111;
    overflow: hidden;
  }

  .container {
    text-align: center;
    max-width: 420px;
    padding: 30px;
  }

  h1 {
    font-size: 90px;
    margin: 0;
    letter-spacing: -8px;
  }

  p {
    color: #555;
    font-size: 18px;
    line-height: 1.5;
  }

  .bot {
    width: 100px;
    height: 80px;
    margin: 25px auto;
    background: #111;
    border-radius: 20px;
    position: relative;
    cursor: pointer;
    transition: transform .3s ease;
  }

  .bot:hover {
    transform: rotate(5deg) scale(1.05);
  }

  .eye {
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 25px;
  }

  .eye.left {
    left: 25px;
  }

  .eye.right {
    right: 25px;
  }

  .mouth {
    width: 35px;
    height: 8px;
    background: white;
    border-radius: 10px;
    position: absolute;
    bottom: 20px;
    left: 32px;
  }

  button {
    border: none;
    background: #111;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    transition: .2s;
  }

  button:hover {
    background: #333;
  }

  #message {
    margin-top: 15px;
    min-height: 25px;
    color: #777;
  }

  .shake {
    animation: shake .4s;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
</style>
</head>

<body>

<div class="container">

  <h1>404</h1>

  <div class="bot" id="bot">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>

  <p>
    This page went on vacation.<br>
    We checked everywhere. Even under the keyboard.
  </p>

  <button onclick="findPage()">Ask the robot</button>

  <div id="message"></div>

</div>


<script>
  const messages = [
    "Robot says: Nope. Still missing.",
    "I searched the internet. It was awkward.",
    "The page is probably hiding from responsibility.",
    "404 detected. Snacks recommended.",
    "Maybe the page needs a GPS?"
  ];

  function findPage() {
    const bot = document.getElementById("bot");
    const msg = document.getElementById("message");

    bot.classList.remove("shake");
    void bot.offsetWidth;
    bot.classList.add("shake");

    msg.textContent = messages[Math.floor(Math.random() * messages.length)];
  }

  document.getElementById("bot").onclick = findPage;
</script>

</body>
</html>
