<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>410 - Link Expired</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FAFAF8;
    --ink:#111110;
    --ink-soft:#5B5B56;
    --red:#D71920;
    --line:#D8D7D0;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --grot: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; border-radius:0 !important; }
  html,body{ height:100%; }
  body{
    margin:0;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--grot);
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:var(--mono); }
  ::selection{ background:var(--red); color:#fff; }

  header{
    border-bottom:1px solid var(--line);
    padding:1.25rem 1.5rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.5rem;
  }
  .container{
    text-align:center;
    max-width:420px;
    width:100%;
  }
  .index-num{
    font-family:var(--mono);
    color:var(--red);
    font-size:0.75rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    display:block;
    margin-bottom:1.5rem;
  }
  h1{
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:0.9;
    font-size:clamp(4rem, 14vw, 6.5rem);
    margin:0;
  }
  h1 span{ color:var(--red); }

  p{
    color:var(--ink-soft);
    font-size:1rem;
    line-height:1.6;
    margin:1.25rem 0 0;
  }

  .bot-wrap{
    position:relative;
    width:100px;
    margin:2rem auto 0.5rem;
  }
  .bot{
    width:100px;
    height:80px;
    background:var(--ink);
    border:1px solid var(--ink);
    position:relative;
    cursor:pointer;
    transition:transform .3s ease;
  }
  .bot:hover{ transform:rotate(-2deg) scale(1.03); }

  .eye{
    width:14px;
    height:2px;
    background:var(--paper);
    position:absolute;
    top:29px;
  }
  .eye.left{ left:24px; }
  .eye.right{ right:24px; }
  .mouth{
    width:30px;
    height:2px;
    background:var(--paper);
    position:absolute;
    bottom:24px;
    left:35px;
  }
  .zzz{
    position:absolute;
    top:-14px;
    right:-6px;
    font-family:var(--mono);
    font-size:0.7rem;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }

  button{
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:0.8rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:0.9rem 1.75rem;
    margin-top:2rem;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  button:hover{ background:var(--paper); color:var(--ink); }
  button:focus{ outline:2px solid var(--red); outline-offset:2px; }

  #message{
    margin-top:1rem;
    min-height:1.5rem;
    font-family:var(--mono);
    font-size:0.8rem;
    color:var(--ink-soft);
  }

  .nudge{ animation: nudge .4s; }
  @keyframes nudge {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }
  @media (prefers-reduced-motion: reduce){
    .bot, button{ transition:none; }
    .nudge{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <span class="mono eyebrow">SANO.REDIRECTME.NET</span>
  <span class="mono eyebrow" style="color:var(--ink-soft)">ERROR — 410</span>
</header>

<main>
  <div class="container">
    <span class="index-num">STATUS — EXPIRED</span>
    <h1>4<span>1</span>0</h1>
    <div class="bot-wrap">
      <div class="bot" id="bot">
        <span class="zzz">zzz</span>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
    </div>
    <p>
      This link had a shelf life.<br>
      It quietly expired. No drama.
    </p>
    <button onclick="findPage()">Ask the robot</button>
    <div id="message"></div>
  </div>
</main>

<script>
  const messages = [
    "Robot says: even links need to retire.",
    "It's in link heaven now.",
    "Time caught up with it. Sorry.",
    "Gone, like your last Friday plans.",
    "It expired faster than milk."
  ];
  function findPage() {
    const bot = document.getElementById("bot");
    const msg = document.getElementById("message");
    bot.classList.remove("nudge");
    void bot.offsetWidth;
    bot.classList.add("nudge");
    msg.textContent = messages[Math.floor(Math.random() * messages.length)];
  }
  document.getElementById("bot").onclick = findPage;
</script>
</body>
</html>
