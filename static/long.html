<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sano.redirectme.net</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script
    src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
    crossorigin="anonymous">
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FAFAF8;
    --ink:#111110;
    --ink-soft:#5B5B56;
    --red:#D71920;
    --line:#D8D7D0;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --grot: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; border-radius:0 !important; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--grot);
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:var(--mono); }
  .hairline{ border-color:var(--line); }
  input:focus, button:focus{ outline:2px solid var(--red); outline-offset:2px; }
  ::selection{ background:var(--red); color:#fff; }

  .headline{
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:0.92;
  font-size:clamp(2.75rem, 4vw, 5.5rem);
  overflow-wrap:break-word;
  word-break:break-word;
}
  .eyebrow{
    font-family:var(--mono);
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  .field{
    border:1px solid var(--ink);
    background:transparent;
    padding:0.9rem 1rem;
    width:100%;
    font-family:var(--mono);
    font-size:0.95rem;
    color:var(--ink);
  }
  .field::placeholder{ color:var(--ink-soft); }
  .btn{
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:0.8rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:0.95rem 1.5rem;
    transition:background .15s ease, color .15s ease;
    cursor:pointer;
  }
  .btn:hover{ background:var(--paper); color:var(--ink); }
  .index-num{
    font-family:var(--mono);
    color:var(--red);
    font-size:0.75rem;
    letter-spacing:0.1em;
  }

  .link-row{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      padding:0.9rem 0;
      border-bottom:1px solid var(--line);
      text-decoration:none;
      color:var(--ink);
    }
    .link-row:last-child{ border-bottom:none; }
    .link-row .link-label{
      font-family:var(--mono);
      font-size:0.95rem;
      letter-spacing:-0.01em;
    }
    .link-row .link-arrow{
      font-family:var(--mono);
      color:var(--ink-soft);
      transition:color .15s ease, transform .15s ease;
    }
    .link-row:hover .link-label{ color:var(--red); }
    .link-row:hover .link-arrow{ color:var(--red); transform:translateX(3px); }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }
</style>
<script>
function copyShortURL(btn, url) {
	navigator.clipboard.writeText(url).then(() => {
		const original = btn.textContent;
		btn.textContent = 'Copied';
		setTimeout(() => { btn.textContent = original; }, 1500);
	}).catch(() => {
		btn.textContent = 'Failed';
	});
}
</script>
</head>
<body>

<header class="border-b hairline">
  <div class="max-w-6xl mx-auto px-6 md:px-10 py-5 flex items-center justify-between">
    <span class="mono eyebrow">SANO.REDIRECTME.NET</span>
    <!--<span class="mono eyebrow" style="color:var(--ink-soft)">GO / HTMX / MYSQL — AIVEN</span>-->
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 md:px-10">
  <div class="grid grid-cols-1 md:grid-cols-12 border-b hairline">

    <!-- left: headline -->
    <div class="md:col-span-5 py-14 md:py-20 md:pr-10 flex flex-col justify-between">
      <h1 class="headline">
        LENGTHEN<br>
        SHORT<br>
        <span style="color:var(--red)">URLS.</span>
      </h1>
      <p class="mono eyebrow mt-10 leading-relaxed" style="color:var(--ink-soft)">
          A SOLUTION THAT NO ONE HAD A PROBLEM WITH. BUT BLAZING-FAST, LOW-LATENCY REDIRECTS
      </p>
    </div>

    <!-- right: functional panel -->
    <div class="md:col-span-7 md:border-l hairline md:pl-10 py-14 md:py-20">
      <form hx-post="/makeitlong" hx-target="#result" hx-swap="innerHTML" class="space-y-8">

        <div>
          <div class="flex items-baseline justify-between mb-3">
            <span class="index-num">01 — INPUT</span>
            <span id="charcount" class="mono text-xs" style="color:var(--ink-soft)">0 CHARACTERS</span>
          </div>
          <input
            id="urlinput"
            class="field"
            type="url"
            name="url"
            required
            pattern="https?://.+"
            title="URL must start with http:// or https://"
            placeholder="https://surajkumal.com.np/some/short/path"
            oninput="document.getElementById('charcount').textContent = this.value.length + ' CHARACTERS'">
        </div>

        <div class="flex items-center justify-between">
          <span class="index-num">02 — GENERATE</span>
          <button class="btn" type="submit">MAKE IT LONG </button>
        </div>

      </form>

      <div class="mt-10 pt-8 border-t hairline">
        <span class="index-num">03 — RESULT</span>
        <div id="result" class="mt-4 mono text-sm" style="color:var(--ink-soft)">
          Waiting for your Input.
        </div>
      </div>
    </div>
  </div>




  <div class="py-10">
      <span class="index-num">04 — ELSEWHERE</span>
      <div class="mt-4">
        <a href="https://sano.redirectme.net/github" class="link-row" target="_blank">
          <span class="link-label">sano.redirectme.net/github</span>

        </a>
        <a href="https://sano.redirectme.net/portfolio" class="link-row" target="_blank">
          <span class="link-label">sano.redirectme.net/portfolio</span>

        </a>
      </div>

      <div class="tooltip">
        <a href="/">
          <button class="btn">Too much URL? Trim it.</button>
        </a>
      </div>
    </div>
</main>

</body>
</html>
