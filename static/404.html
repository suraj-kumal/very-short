<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Lost Page</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FAFAF8;
    --ink:#111110;
    --ink-soft:#5B5B56;
    --red:#D71920;
    --line:#D8D7D0;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --grot: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; border-radius:0 !important; }
  html,body{ height:100%; }
  body{
    margin:0;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--grot);
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:var(--mono); }
  .hairline{ border-color:var(--line); }
  ::selection{ background:var(--red); color:#fff; }

  header{
    border-bottom:1px solid var(--line);
    padding:1.25rem 1.5rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.5rem;
  }
  .container{
    text-align:center;
    max-width:420px;
    width:100%;
  }
  .index-num{
    font-family:var(--mono);
    color:var(--red);
    font-size:0.75rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    display:block;
    margin-bottom:1.5rem;
  }
  h1{
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:0.9;
    font-size:clamp(4rem, 14vw, 6.5rem);
    margin:0;
  }
  h1 span{ color:var(--red); }

  p{
    color:var(--ink-soft);
    font-size:1rem;
    line-height:1.6;
    margin:1.25rem 0 0;
  }

  .bot{
    width:100px;
    height:80px;
    margin:2rem auto 0.5rem;
    background:var(--ink);
    border:1px solid var(--ink);
    position:relative;
    cursor:pointer;
    transition:transform .3s ease;
  }
  .bot:hover{
    transform:rotate(3deg) scale(1.04);
  }
  .eye{
    width:10px;
    height:10px;
    background:var(--red);
    position:absolute;
    top:24px;
  }
  .eye.left{ left:26px; }
  .eye.right{ right:26px; }
  .mouth{
    width:34px;
    height:6px;
    background:var(--paper);
    position:absolute;
    bottom:20px;
    left:33px;
  }

  button{
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:0.8rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:0.9rem 1.75rem;
    margin-top:2rem;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  button:hover{
    background:var(--paper);
    color:var(--ink);
  }
  button:focus{ outline:2px solid var(--red); outline-offset:2px; }

  #message{
    margin-top:1rem;
    min-height:1.5rem;
    font-family:var(--mono);
    font-size:0.8rem;
    color:var(--ink-soft);
  }

  .shake{ animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  @media (prefers-reduced-motion: reduce){
    .bot, button{ transition:none; }
    .shake{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <span class="mono eyebrow">SANO.REDIRECTME.NET</span>
  <span class="mono eyebrow" style="color:var(--ink-soft)">ERROR — 404</span>
</header>

<main>
  <div class="container">
    <span class="index-num">STATUS — NOT FOUND</span>
    <h1>4<span>0</span>4</h1>
    <div class="bot" id="bot">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
    <p>
      This page went on vacation.<br>
      We checked everywhere. Even under the keyboard.
    </p>
    <button onclick="findPage()">Ask the robot</button>
    <div id="message"></div>
  </div>
</main>

<script>
  const messages = [
    "Robot says: Nope. Still missing.",
    "I searched the internet. It was awkward.",
    "The page is probably hiding from responsibility.",
    "404 detected. Snacks recommended.",
    "Maybe the page needs a GPS?"
  ];
  function findPage() {
    const bot = document.getElementById("bot");
    const msg = document.getElementById("message");
    bot.classList.remove("shake");
    void bot.offsetWidth;
    bot.classList.add("shake");
    msg.textContent = messages[Math.floor(Math.random() * messages.length)];
  }
  document.getElementById("bot").onclick = findPage;
</script>
</body>
</html>
